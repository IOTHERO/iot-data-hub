# The platform broker the hub reads native devices from (HUB_PLATFORM_BROKER=platform): EMQX on
# the internal Docker network (1883 is not published; devices use 8883 with TLS from outside).
brokers:
  - broker_id: platform
    host: emqx
    port: 1883
    username_env: HUB_PLATFORM_MQTT_USERNAME
    password_env: HUB_PLATFORM_MQTT_PASSWORD
