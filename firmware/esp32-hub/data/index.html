<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>TiTiSwitch · TiTi Hub</title>
<style>
:root{--bg:#0a0c11;--bg2:#10131b;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);
--tx:#eef0f6;--mut:#8b93a7;--gold:#d9b46a;--gold2:#f6dfa6;--ok:#36d399;--bad:#ff5d6c;--warn:#ffb547;--info:#6aa8ff;
--r:18px;--sh:0 10px 40px rgba(0,0,0,.45)}
/* Persian: Vazirmatn (Google Fonts, OFL; Persian/Arabic characters only, in static/fonts). English and digits: Arial. */
@font-face{font-family:"Vazirmatn";src:url(/static/fonts/vazirmatn-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Vazirmatn";src:url(/static/fonts/vazirmatn-700.woff2) format("woff2");font-weight:600 800;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Vazirmatn",Arial,"Helvetica Neue",Helvetica,sans-serif;color:var(--tx);background:var(--bg);
background-image:radial-gradient(1200px 600px at 85% -10%,rgba(217,180,106,.13),transparent 60%),
radial-gradient(900px 500px at -10% 110%,rgba(106,168,255,.08),transparent 60%);background-attachment:fixed;
font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
[dir=ltr] body{font-family:Arial,"Helvetica Neue",Helvetica,"Vazirmatn",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:380px;padding:34px 28px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(18px);animation:rise .6s ease both;text-align:center}
.logo{width:92px;height:92px;margin:0 auto 6px;display:grid;place-items:center;background:none}
.logo svg{width:92px;height:92px;filter:drop-shadow(0 0 18px rgba(0,180,205,.35))}
.tsw{text-align:center;font-weight:700;letter-spacing:.5px;color:#00B4CD;margin:0 0 6px;direction:ltr}
.lbox h1{font-size:22px;margin-bottom:4px}
.lbox p{color:var(--mut);margin-bottom:22px;font-size:13px}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-end:1px solid var(--line);background:rgba(10,12,17,.6);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.brand .logo{width:44px;height:44px;margin:0}.brand .logo svg{width:44px;height:44px;filter:none}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--mut);border:1px solid transparent;transition:.25s;background:none;text-align:start;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:var(--tx);background:var(--card)}
.nav.on{color:var(--tx);background:linear-gradient(135deg,rgba(217,180,106,.18),rgba(217,180,106,.04));border-color:rgba(217,180,106,.3)}
.nav.on svg{color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{padding:22px clamp(16px,3vw,36px) 120px;max-width:1180px;width:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
header h2{font-size:22px;font-weight:700;margin-inline-end:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 1s infinite}
.page{display:none;animation:rise .45s ease both}.page.on{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 small{color:var(--mut);font-weight:400;font-size:12px;margin-inline-start:auto}
.card .sub{color:var(--mut);font-size:12.5px;margin:-8px 0 14px}
.stat{padding:18px}
.stat .k{color:var(--mut);font-size:12px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir=rtl] .stat .v{text-align:right}
.hero{background:linear-gradient(135deg,rgba(217,180,106,.16),rgba(255,255,255,.02) 55%);border-color:rgba(217,180,106,.25)}
.hero .big{font-size:28px;font-weight:800}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-bottom:12px;font-size:13px;border:1px solid}
.alert.warn{background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.3);color:#ffd79a}
.alert.bad{background:rgba(255,93,108,.08);border-color:rgba(255,93,108,.3);color:#ffb3bb}
.alert.info{background:rgba(106,168,255,.08);border-color:rgba(106,168,255,.3);color:#bcd6ff}
/* forms */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.in,select.in,textarea.in{width:100%;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;transition:.2s}
.in:focus{border-color:rgba(217,180,106,.6);box-shadow:0 0 0 4px rgba(217,180,106,.12)}
.in.ltr{direction:ltr;text-align:left}
textarea.in{min-height:110px;font-family:Consolas,monospace;font-size:12px;direction:ltr}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.pw{position:relative}.pw .eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.tg input{display:none}
.tg i{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:.3s;flex:none}
.tg i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tg input:checked+i{background:linear-gradient(135deg,var(--gold),#b48a3c)}
[dir=rtl] .tg input:checked+i:after{transform:translateX(-20px)}
[dir=ltr] .tg input:checked+i:after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;transition:.2s;font-weight:600;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--gold),#b8893a);color:#1a1307;border:0;box-shadow:0 6px 24px rgba(217,180,106,.3)}
.btn.red{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.35);color:#ff9aa5}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* mode cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.mode{cursor:pointer;padding:22px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);transition:.3s;text-align:start}
.mode svg{width:34px;height:34px;color:var(--mut);transition:.3s}
.mode b{display:block;font-size:17px;margin:10px 0 2px}.mode span{color:var(--mut);font-size:12.5px}
.mode.on{border-color:var(--gold);background:linear-gradient(150deg,rgba(217,180,106,.16),rgba(217,180,106,.02));box-shadow:0 0 0 4px rgba(217,180,106,.08),var(--sh)}
.mode.on svg{color:var(--gold)}
/* scan */
.nets{max-height:260px;overflow:auto;margin:-4px 0 14px;display:flex;flex-direction:column;gap:6px}
.net{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);cursor:pointer;transition:.2s}
.net:hover{border-color:rgba(217,180,106,.45)}.net.sel{border-color:var(--gold);background:rgba(217,180,106,.08)}
.net b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.sig{display:flex;gap:2px;align-items:flex-end;height:16px}.sig i{width:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.sig i.on{background:var(--gold)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
/* servers */
.srv{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:rgba(0,0,0,.15);overflow:hidden}
.srv>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.srv>.hd b{flex:1}.srv>.bd{padding:4px 14px 14px;display:none}.srv.open>.bd{display:block}
.num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card2);font-size:12px;font-weight:700}
/* relays */
.relays{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.rl{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.35s;position:relative;overflow:hidden}
.rl:before{content:"";position:absolute;inset:0;background:radial-gradient(240px 140px at 50% -20%,rgba(54,211,153,.25),transparent 70%);opacity:0;transition:.4s}
.rl.on{border-color:rgba(54,211,153,.45);box-shadow:0 0 30px rgba(54,211,153,.12)}
.rl.on:before{opacity:1}
.rl.na{opacity:.45}
.rl .top{display:flex;align-items:center;justify-content:space-between;position:relative}
.rl .nm{font-weight:700}.rl .no{font-size:11px;color:var(--mut)}
.pwr{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;margin:16px auto 12px;position:relative;
background:radial-gradient(circle at 35% 30%,#2a2f3d,#141720);box-shadow:inset 0 2px 6px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.5);transition:.3s;color:var(--mut)}
.pwr svg{width:28px;height:28px}
.rl.on .pwr{color:#062016;background:radial-gradient(circle at 35% 30%,#6ff2bf,#1fae74);box-shadow:0 0 0 6px rgba(54,211,153,.15),0 0 36px rgba(54,211,153,.55)}
.rl.wait .pwr{animation:pulse .6s infinite}
.rl .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mut);position:relative}
.rl .st{font-weight:700;letter-spacing:.5px}.rl.on .st{color:var(--ok)}
.pulse{display:flex;gap:6px;margin-top:12px;position:relative}
.pulse .in{padding:6px 8px;text-align:center;direction:ltr}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,181,71,.15);color:var(--warn)}
/* inputs */
.dips{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;direction:ltr}
.dip{text-align:center;font-size:11px;color:var(--mut)}
.dip .sw{height:54px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);position:relative;margin-bottom:6px}
.dip .sw:after{content:"";position:absolute;left:5px;right:5px;height:22px;bottom:5px;border-radius:7px;background:#3a3f4d;transition:.35s cubic-bezier(.5,1.6,.5,1)}
.dip.on .sw:after{bottom:27px;background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 0 14px rgba(217,180,106,.6)}
.dip.cfg.on .sw:after{background:linear-gradient(#ffd0a0,var(--warn))}
.addr{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.addr b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:11.5px}
td .in{padding:7px 10px}
code{font-family:Consolas,monospace;font-size:12px;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
/* log */
.log{height:330px;overflow:auto;background:#05070b;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.log div{white-space:pre-wrap;word-break:break-word;padding:1px 0;animation:fade .3s}
.log .l0{color:#ff8a95}.log .l1{color:#ffc76b}.log .l2{color:#c9d1e3}.log .l3{color:#7f889c}
.log span{color:#4d566a;margin-right:8px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .2s}
/* product label */
.lbl{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.qrbox{background:#fff;border-radius:16px;padding:10px;box-shadow:0 0 0 1px rgba(217,180,106,.35),0 10px 30px rgba(0,0,0,.4);line-height:0}
.qrbox svg{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv span{color:var(--mut)}.kv b{direction:ltr;text-align:start;font-family:Consolas,monospace;font-weight:600;word-break:break-all}
@media(max-width:560px){.lbl{grid-template-columns:1fr;justify-items:center}}
@media print{body *{visibility:hidden!important}#labelCard,#labelCard *{visibility:visible!important}
#labelCard{position:absolute;left:0;top:0;background:#fff;color:#000;border:0}#labelCard .bar,#labelCard details,#labelCard .sub{display:none!important}}
/* save bar */
.savebar{position:fixed;bottom:18px;left:50%;transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:18px;
background:rgba(20,22,30,.92);border:1px solid rgba(217,180,106,.35);box-shadow:var(--sh);backdrop-filter:blur(14px);transition:.4s cubic-bezier(.3,1.4,.5,1);z-index:30;visibility:hidden}
[dir=rtl] .savebar{padding:10px 18px 10px 12px}
.savebar.show{transform:translate(-50%,0);visibility:visible}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .25s}
.modal .box{width:100%;max-width:420px;background:#141720;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh);animation:rise .35s}
.modal h3{font-size:18px;margin-bottom:8px}.modal p{color:var(--mut);margin-bottom:18px}
.swstate{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin-bottom:18px;font-weight:600}
#toasts{position:fixed;top:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:12px 16px;border-radius:14px;background:#171a24;border:1px solid var(--line);box-shadow:var(--sh);animation:slide .35s;min-width:220px;border-inline-start:3px solid var(--gold)}
.toast.bad{border-inline-start-color:var(--bad)}.toast.ok{border-inline-start-color:var(--ok)}
/* mobile dock */
.dock{display:none}
@media(max-width:860px){
#app{grid-template-columns:1fr}aside{display:none}
main{padding-bottom:130px}
.dock{display:flex;position:fixed;bottom:12px;left:12px;right:12px;justify-content:space-around;padding:8px;border-radius:22px;background:rgba(18,20,28,.85);border:1px solid var(--line);backdrop-filter:blur(18px);z-index:20;box-shadow:var(--sh)}
.dock .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:8px 6px;justify-content:center;align-items:center;text-align:center}
.savebar{bottom:96px}
.modes{grid-template-columns:1fr}
}
/* phones: two relay tiles per row, tighter padding, nothing wider than the screen */
@media(max-width:560px){
main{padding-left:12px;padding-right:12px}
.relays{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rl{padding:12px}.rl .pulse{flex-wrap:wrap}.rl .pulse .in{width:100%!important}.rl .pulse .btn{flex:1 1 100%}
.card{padding:16px}
.dock{left:8px;right:8px}
.dock .nav span{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
main,.card,.grid>*{min-width:0}
.alert,.kv b,.chip{overflow-wrap:anywhere}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 60px rgba(217,180,106,.55)}}
/* hub pages */
.mod{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;transition:.3s}
.mod.on{border-color:rgba(54,211,153,.35)}
.mod .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod .hd b{font-size:15px}
.mod .hd small{color:var(--mut)}
.vals{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vchip{padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:12px;direction:ltr}
.vchip b{font-weight:600;margin-inline-start:6px}
.rbtn{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);cursor:pointer;font-size:12px;direction:ltr;transition:.2s}
.rbtn.on{background:rgba(54,211,153,.18);border-color:rgba(54,211,153,.5);color:var(--ok)}
.rbtn[disabled]{opacity:.4;pointer-events:none}
.sc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin-bottom:8px;flex-wrap:wrap}
.sc b{flex:1;min-width:120px}
.sc small{color:var(--mut);display:block;font-weight:400}
.sc.run{border-color:var(--gold)}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.link b{flex:1;font-weight:600}.link span{color:var(--mut);font-size:12px;direction:ltr}
.keybox{font-family:Consolas,monospace;font-size:12px;direction:ltr;text-align:left;word-break:break-all;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px dashed var(--line)}
.tblwrap{overflow:auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="i-logo" viewBox="0 0 512 512"><g transform="translate(-57 1) scale(0.33)"><path d="M1199 327.5H499.5V554.5H726.5V1006H953.5V554.5H1180.5V1006H1444.5V1233H702" fill="none" stroke="#00B4CD" stroke-width="37"/><rect x="783" y="529" width="112" height="279" rx="56" fill="#F58634"/><circle cx="839" cy="600" r="28" fill="#fff"/><rect x="1011" y="739" width="112" height="279" rx="56" fill="#F58634"/><circle cx="1067" cy="946" r="28" fill="#fff"/><circle cx="1264" cy="320" r="33" fill="#00B4CD"/><circle cx="647" cy="1233" r="32" fill="#00B4CD"/><path d="M1192.8 268.3A88 88 0 0 1 1298.4 239.0 M1145.4 240.0A143 143 0 0 1 1324.4 190.4 M1331.8 372.9A86 86 0 0 1 1230.4 399.2 M1381.7 399.4A142 142 0 0 1 1201.8 447.6" fill="none" stroke="#00B4CD" stroke-width="20" stroke-linecap="round"/><path d="M590.4 1289.6A80 80 0 0 1 590.4 1176.4 M550.1 1329.9A137 137 0 0 1 550.1 1136.1 M509.1 1370.9A195 195 0 0 1 509.1 1095.1" fill="none" stroke="#00B4CD" stroke-width="32" stroke-linecap="round"/></g></symbol>
<symbol id="i-dash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-3H4zm10-13h6V4h-6z"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0M12 19h.01M2 9a14.5 14.5 0 0 1 20 0"/></symbol>
<symbol id="i-rl" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0"/></symbol>
<symbol id="i-sys" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
<symbol id="i-rs" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3 7h18M3 17h18M7 7v10M12 7v10M17 7v10"/></symbol>
<symbol id="i-re" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-mod" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 4l13 8-13 8z"/></symbol>
<symbol id="i-gsm" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 20V14M9 20V10M14 20V6M19 20V3"/></symbol>
</svg>

<section id="login">
  <div class="lbox">
    <div class="logo"><svg><use href="#i-logo"/></svg></div>
    <p class="tsw">TiTiSwitch</p>
    <h1><span class="gold">TiTi Hub</span></h1>
    <p data-t="loginSub"></p>
    <label class="f"><span data-t="adminPass"></span>
      <div class="pw"><input class="in ltr" id="lpass" type="password" autocomplete="current-password">
      <button class="eye" type="button" data-eye="lpass"><svg width="18" height="18"><use href="#i-eye"/></svg></button></div></label>
    <button class="btn pri" style="width:100%" id="lbtn" data-t="signIn"></button>
    <p id="lerr" style="color:var(--bad);margin:12px 0 0"></p>
    <div style="margin-top:18px"><button class="btn sm" data-lang></button></div>
  </div>
</section>

<div id="app" class="hide">
  <aside>
    <div class="brand"><div class="logo"><svg><use href="#i-logo"/></svg></div><div><b id="bname">TiTi Hub</b><small id="bfw"></small></div></div>
    <div id="navs"></div>
    <div class="side-foot">
      <button class="btn sm" data-lang></button>
      <button class="btn sm red" data-restart><svg><use href="#i-re"/></svg><span data-t="restart"></span></button>
    </div>
  </aside>
  <main>
    <header>
      <h2 id="ptitle"></h2>
      <span class="chip"><span class="dot" id="livedot"></span><span id="livetx"></span></span>
      <span class="chip"><span class="dot" id="cfgdot"></span><span data-t="cfgSwitch"></span>: <b id="cfgtx"></b></span>
    </header>

    <!-- DASHBOARD -->
    <section class="page" id="p-dash">
      <div id="alerts"></div>
      <div class="grid g2" style="margin-bottom:16px">
        <div class="card hero">
          <h3 data-t="hub"></h3>
          <div class="big gold" id="dname"></div>
          <div style="color:var(--mut);margin-top:6px" id="dmode"></div>
          <div class="bar" style="margin-top:16px"><span class="chip" id="dfw"></span><span class="chip" id="daddr"></span><span class="chip" id="did"></span></div>
        </div>
        <div class="card">
          <h3 data-t="links"></h3>
          <div class="links" id="linkbox"></div>
        </div>
      </div>
      <div class="grid g4">
        <div class="card stat"><div class="k" data-t="modOnline"></div><div class="v" id="smo">-</div></div>
        <div class="card stat"><div class="k" data-t="clock"></div><div class="v" id="stm" style="font-size:18px">-</div></div>
        <div class="card stat"><div class="k" data-t="uptime"></div><div class="v" id="sup">-</div></div>
        <div class="card stat"><div class="k" data-t="heap"></div><div class="v" id="shp">-</div></div>
        <div class="card stat"><div class="k" data-t="rtcTemp"></div><div class="v" id="srt">-</div></div>
        <div class="card stat"><div class="k" data-t="resetReason"></div><div class="v" id="srr" style="font-size:16px">-</div></div>
        <div class="card stat"><div class="k" data-t="sceneCount"></div><div class="v" id="ssc">-</div></div>
        <div class="card stat"><div class="k" data-t="enrollment"></div><div class="v" id="sen" style="font-size:16px">-</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3><span data-t="alarms"></span><small><button class="btn sm" id="ackBtn" data-t="ack"></button></small></h3>
        <div id="alarmList"></div>
      </div>
    </section>

    <!-- MODULES -->
    <section class="page" id="p-mods">
      <div class="bar" style="margin-bottom:16px">
        <button class="btn pri" id="enrollBtn"></button>
        <span style="color:var(--mut);font-size:12.5px" data-t="enrollSub"></span>
      </div>
      <div id="modList"></div>
      <div class="card" style="margin-top:16px">
        <h3 data-t="registry"></h3>
        <p class="sub" data-t="registrySub"></p>
        <div class="tblwrap"><table>
          <thead><tr><th data-t="modId"></th><th data-t="modSecret"></th><th data-t="name"></th><th data-t="alias"></th><th></th></tr></thead>
          <tbody id="regBody"></tbody></table></div>
        <div class="bar" style="margin-top:14px"><button class="btn sm" id="regAdd" data-t="addModule"></button><button class="btn pri sm" id="regSave" data-t="save"></button></div>
      </div>
    </section>

    <!-- SCENES -->
    <section class="page" id="p-scenes">
      <div class="card" style="margin-bottom:16px">
        <h3><span data-t="scenes"></span><small data-t="scenesSub"></small></h3>
        <div id="sceneList"></div>
      </div>
      <div class="card">
        <h3 data-t="sceneEditor"></h3>
        <p class="sub" data-t="sceneHelp"></p>
        <div class="bar" style="margin-bottom:10px">
          <select class="in" id="tplSel" style="max-width:260px"></select>
          <button class="btn sm" id="tplAdd" data-t="addTemplate"></button>
        </div>
        <textarea class="in" id="sceneJson" rows="14" spellcheck="false"></textarea>
        <div class="bar" style="margin-top:12px"><button class="btn pri" id="sceneSave" data-t="saveScenes"></button><span id="sceneMsg" style="color:var(--mut)"></span></div>
      </div>
    </section>

    <!-- CONNECTION -->
    <section class="page" id="p-conn">
      <div class="grid g2">
        <div class="card">
          <h3 data-t="lan"></h3>
          <label class="f"><span data-t="netMode"></span><select class="in" data-k="net.mode" data-num>
            <option value="0" data-t="nm0"></option><option value="1" data-t="nm1"></option><option value="2" data-t="nm2"></option><option value="3" data-t="nm3"></option></select></label>
          <label class="tg"><span data-t="dhcp"></span><input type="checkbox" data-k="net.ethDhcp"><i></i></label>
          <div class="row">
            <label class="f"><span>IP</span><input class="in ltr" data-k="net.ethIp" maxlength="15"></label>
            <label class="f"><span data-t="subnet"></span><input class="in ltr" data-k="net.ethMask" maxlength="15"></label>
            <label class="f"><span data-t="gateway"></span><input class="in ltr" data-k="net.ethGw" maxlength="15"></label>
            <label class="f"><span>DNS</span><input class="in ltr" data-k="net.ethDns" maxlength="15"></label>
          </div>
          <label class="f"><span data-t="hostname"></span><input class="in ltr" data-k="net.hostname" maxlength="23"></label>
        </div>
        <div class="card">
          <h3 data-t="wifiNet"></h3>
          <div class="bar" style="margin-bottom:10px"><button class="btn sm" id="scanBtn" data-t="scan"></button></div>
          <div class="nets" id="nets"></div>
          <label class="f"><span data-t="ssid"></span><input class="in ltr" data-k="net.wifiSsid" maxlength="32"></label>
          <label class="f"><span data-t="password"></span><input class="in ltr" type="password" data-k="net.wifiPass" data-secret="net.wifiPassSet" maxlength="63" autocomplete="new-password"></label>
          <label class="f"><span data-t="backupNet"></span><input class="in ltr" data-k="net.wifiSsid2" maxlength="32"></label>
          <label class="f"><span data-t="password"></span><input class="in ltr" type="password" data-k="net.wifiPass2" data-secret="net.wifiPass2Set" maxlength="63" autocomplete="new-password"></label>
        </div>
        <div class="card">
          <h3 data-t="server"></h3>
          <p class="sub" data-t="serverSub"></p>
          <label class="tg"><span data-t="srvEnabled"></span><input type="checkbox" data-k="cloud.enabled"><i></i></label>
          <label class="f"><span data-t="hubId"></span><input class="in ltr" data-k="id.hubId" maxlength="32"></label>
          <label class="f"><span data-t="hubSecret"></span><input class="in ltr" type="password" data-k="id.hubSecret" data-secret="id.hubSecretSet" maxlength="64" autocomplete="new-password"></label>
          <label class="tg"><span data-t="tls"></span><input type="checkbox" data-k="cloud.tls"><i></i></label>
          <label class="f"><span data-t="caPem"></span><textarea class="in" rows="3" data-k="cloud.ca" data-secret="cloud.caSet" spellcheck="false"></textarea></label>
          <div class="bar" style="margin-bottom:12px"><button class="btn sm" id="caClear" data-t="clearCa"></button></div>
          <div class="row">
            <label class="f"><span data-t="host"></span><input class="in ltr" data-k="cloud.host" maxlength="63"></label>
            <label class="f"><span data-t="port"></span><input class="in ltr" type="number" data-k="cloud.port" data-num></label>
            <label class="f"><span data-t="prefix"></span><input class="in ltr" data-k="cloud.prefix" maxlength="15"></label>
            <label class="f"><span data-t="keepalive"></span><input class="in ltr" type="number" data-k="cloud.keepalive" data-num></label>
          </div>
          <label class="f"><span data-t="lostAlarm"></span><input class="in ltr" type="number" data-k="cloud.lostAlarmS" data-num></label>
        </div>
        <div class="card">
          <h3 data-t="modBroker"></h3>
          <p class="sub" data-t="modBrokerSub"></p>
          <div class="row">
            <label class="f"><span data-t="port"></span><input class="in ltr" type="number" data-k="modules.brokerPort" data-num></label>
            <label class="f"><span data-t="offlineS"></span><input class="in ltr" type="number" data-k="modules.offlineS" data-num></label>
          </div>
          <h3 style="margin-top:18px" data-t="phoneApi"></h3>
          <p class="sub" data-t="phoneApiSub"></p>
          <label class="tg"><span data-t="localEnabled"></span><input type="checkbox" data-k="local.enabled"><i></i></label>
          <label class="f"><span data-t="port"></span><input class="in ltr" type="number" data-k="local.port" data-num></label>
          <div class="bar"><button class="btn sm" id="keyShow" data-t="showKeys"></button><button class="btn sm red" id="keyNew" data-t="newKey"></button></div>
          <div class="keybox hide" id="keyBox" style="margin-top:12px"></div>
          <h3 style="margin-top:18px" data-t="ntp"></h3>
          <label class="f"><span data-t="ntp"></span><input class="in ltr" data-k="net.ntp" maxlength="39"></label>
          <label class="f"><span data-t="utcOffset"></span><input class="in ltr" type="number" data-k="net.utcOffsetMin" data-num></label>
        </div>
      </div>
    </section>

    <!-- GSM AND CLOCK -->
    <section class="page" id="p-gsm">
      <div class="grid g2">
        <div class="card">
          <h3><span data-t="gsm"></span><small id="gsmState"></small></h3>
          <label class="tg"><span data-t="gsmEnabled"></span><input type="checkbox" data-k="gsm.enabled"><i></i></label>
          <label class="f"><span>APN</span><input class="in ltr" data-k="gsm.apn" maxlength="31"></label>
          <label class="f"><span data-t="simPin"></span><input class="in ltr" type="password" data-k="gsm.simPin" data-secret="gsm.simPinSet" maxlength="8" autocomplete="new-password"></label>
          <label class="tg"><span data-t="smsEnabled"></span><input type="checkbox" data-k="gsm.smsEnabled"><i></i></label>
          <p class="sub" data-t="smsHelp"></p>
        </div>
        <div class="card">
          <h3 data-t="contacts"></h3>
          <p class="sub" data-t="contactsSub"></p>
          <div class="tblwrap"><table>
            <thead><tr><th data-t="name"></th><th data-t="phone"></th><th data-t="cmds"></th><th data-t="alarmsShort"></th><th></th></tr></thead>
            <tbody id="ctBody"></tbody></table></div>
          <div class="bar" style="margin-top:14px"><button class="btn sm" id="ctAdd" data-t="addContact"></button></div>
        </div>
        <div class="card">
          <h3 data-t="clock"></h3>
          <div class="kv">
            <span data-t="time"></span><b id="ckTime">—</b>
            <span data-t="source"></span><b id="ckSrc">—</b>
            <span data-t="rtc"></span><b id="ckRtc">—</b>
          </div>
          <div class="bar" style="margin-top:14px"><button class="btn" id="setTime" data-t="setFromDevice"></button></div>
          <p class="sub" style="margin-top:12px" data-t="clockHelp"></p>
        </div>
      </div>
    </section>

    <!-- SYSTEM -->
    <section class="page" id="p-sys">
      <div class="grid g2">
        <div class="card">
          <h3 data-t="general"></h3>
          <label class="f"><span data-t="devName"></span><input class="in" data-k="deviceName" maxlength="31"></label>
          <label class="f"><span data-t="newAdmin"></span><input class="in ltr" type="password" data-k="system.adminPass" data-secret="system.adminPassSet" maxlength="32" autocomplete="new-password"></label>
          <label class="f"><span data-t="apPass"></span><input class="in ltr" type="password" data-k="system.apPass" data-secret="system.apPassSet" maxlength="63" autocomplete="new-password"></label>
          <label class="f"><span data-t="logLevel"></span><select class="in" data-k="system.logLevel" data-num>
            <option value="0" data-t="lvE"></option><option value="1" data-t="lvW"></option><option value="2" data-t="lvI"></option><option value="3" data-t="lvD"></option></select></label>
        </div>
        <div class="card">
          <h3><span data-t="firmware"></span><small id="fwv"></small></h3>
          <p class="sub" data-t="otaSub"></p>
          <input type="file" id="otaFile" accept=".bin" class="in">
          <label class="tg"><span data-t="otaFs"></span><input type="checkbox" id="otaFs"><i></i></label>
          <div class="prog"><i id="otaBar"></i></div>
          <div class="bar" style="margin-top:12px"><button class="btn pri" id="otaBtn" data-t="upload"></button><span id="otaTx" style="color:var(--mut)"></span></div>
          <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
          <h3 data-t="backup"></h3>
          <div class="bar">
            <button class="btn" id="bkBtn" data-t="download"></button>
            <label class="btn"><span data-t="restore"></span><input type="file" id="rsFile" accept=".json" class="hide"></label>
            <button class="btn red" id="facBtn" data-t="factory"></button>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3><span data-t="liveLog"></span><small><button class="btn sm" id="logPause" data-t="pause"></button> <button class="btn sm" id="logClear" data-t="clear"></button></small></h3>
        <div class="log" id="log"></div>
      </div>
    </section>
  </main>
  <nav class="dock" id="dock"></nav>
</div>

<div class="savebar" id="savebar"><span data-t="unsaved"></span><button class="btn sm" id="discard" data-t="discard"></button><button class="btn pri sm" id="save" data-t="save"></button></div>
<div id="toasts"></div>
<div id="modal"></div>
<script src="/static/app.js"></script>
</body>
</html>
